# ── App ──────────────────────────────────────────────
spring.application.name=unihub

# ── PostgreSQL ────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/unihubdb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Server ────────────────────────────────────────────
server.port=8080

# ── JWT ───────────────────────────────────────────────
app.jwt.secret=your-256-bit-secret-key-here-replace-in-production
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=15552000000

# ── OTP ──────────────────────────────────────────────
app.otp.expiry-minutes=10

# ── Mail ─────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.university.email-domain=spu.edu.iq

# ── Swagger ───────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html